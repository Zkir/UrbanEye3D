# This workflow builds plugin package (jar) and runs autotest. This is used to test commits

name: Maven Package

on:
  push:
    branches:
      - master

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    #Step 1 to checkout repository
    - uses: actions/checkout@v7
    - name: Set up JDK 11
      uses: actions/setup-java@v5
      with:
        java-version: '11'
        distribution: 'temurin'
        server-id: github # Value of the distributionManagement/repository/id field of the pom.xml
        settings-path: ${{ github.workspace }} # location for the settings.xml file
        
    #Step 2 to cache m2 repository
    - uses: actions/cache@v6
      env:
        cache-name: cache-maven-dependency
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-maven-       
          
    #Step 3 to build with maven
    - name: Build with Maven
      run: mvn -B package --file pom.xml -s $GITHUB_WORKSPACE/settings.xml -Dtest="!GroundPlaneTest" 
      env:
        GITHUB_TOKEN: ${{ github.token }}
        
   
